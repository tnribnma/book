<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
  <div class="min-h-screen flex items-center justify-center">
    <div class="card w-full max-w-md">
      <h2 class="text-2xl font-bold text-center mb-6">Create Account</h2>
      
      <input type="email" id="regEmail" placeholder="Email" class="w-full p-3 border rounded-lg mb-3">
      <input type="password" id="regPassword" placeholder="Password" class="w-full p-3 border rounded-lg mb-6">
      
      <button onclick="register()" 
              class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700">
        Register
      </button>
      
      <p class="text-center mt-4">
        Already have an account? <a href="login.html" class="text-blue-600">Login</a>
      </p>
      <p id="regMessage" class="text-center mt-4"></p>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
